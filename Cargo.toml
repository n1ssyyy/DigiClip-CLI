[package]
name = "digiclip-rs"
version = "2.0.1"
edition = "2021"
description = "DigiClip CLI — drop a video, get TikTok-ready clips or a subtitled full video. Offline STT via whisper.cpp, clip-picking via OpenRouter with heuristic fallback, 9:16 renders via ffmpeg."
license = "MIT"

[[bin]]
name = "digiclip"
path = "src/main.rs"

[lib]
name = "digiclip_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
dirs = "5"
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
whisper-rs = "0.16"
ndarray = "0.17"
hound = "3"
zip = "2"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tower = { version = "0.5.3", features = ["util"] }

# ONNX Runtime: DirectML execution provider exists on Windows only.
# Linux/macOS build plain CPU (+ CoreML via system libs where ort enables
# it by default); Tracker::load degrades to CPU there (see track.rs).
[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["ndarray", "directml"] }

[target.'cfg(not(windows))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
